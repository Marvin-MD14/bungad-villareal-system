name: CI

# The frontend had no automated coverage for a long stretch, which is how a
# crashing audit page and a 401-ing catalog reached users while `npm run build`
# stayed green. This runs the backend suite, the frontend tests and the build on
# every push and PR, so a regression is caught by the pipeline rather than by
# someone opening the app.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests create their own database; SQLite keeps CI free of secrets.
      DATABASE_URL: sqlite:///ci.sqlite3
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: '*'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      # The schema map in ERD.md is a claim about the models, so it is checked like one:
      # a foreign key that is not in the registry (or an on_delete that moved) fails here
      # with the exact line, before the suite hides it behind passing tests.
      - run: python manage.py erd --check
      - run: python manage.py test api -v 1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
