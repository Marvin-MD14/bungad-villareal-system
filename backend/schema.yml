  /api/auth/rotate-token/:
    post:
      operationId: auth_rotate_token_create
      description: Issues a fresh expiring token for the calling device and revokes
        the one that was presented. Use this to renew a long shift without re-entering
        the password; a compromised key cannot be extended this way, because the successor
        is a new random value rather than a reissue of the old one.
      summary: Rotate this device token
      tags:
      - Auth
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotateTokenResponse'
          description: ''
