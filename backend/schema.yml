          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusinessRequest'
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
    delete:
      operationId: businesses_destroy
      description: |-
        Hard-delete a business, refusing when it still owns history.

        §7.10 prefers deactivating (``is_active = False``) over deleting, so a
        business that has ever traded is retired rather than erased; otherwise
        historical reports would silently lose their rows.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this business.
        required: true
      tags:
      - businesses
      security:
      - TokenAuth: []
      responses:
        '204':
          description: No response body
