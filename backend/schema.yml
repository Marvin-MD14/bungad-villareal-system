      parameters:
      - in: path
        name: branch_id
        schema:
          type: integer
        required: true
      tags:
      - Branch Catalog
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
