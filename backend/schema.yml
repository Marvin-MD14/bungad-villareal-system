  /api/auth/capabilities/:
    get:
      operationId: auth_capabilities_retrieve
      description: Derived from the live ROLE_ACTIONS matrix, so the SPA never keeps
        its own copy of the permission policy. Returns the caller’s effective role,
        the capability names they may show, and the full role list for pickers.
      summary: Roles and UI capabilities for the caller
      tags:
      - Auth
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Verifies username/password and returns a DRF token plus profile
        data. Rate limited to 10 requests per minute.
      summary: Authenticate and obtain an API token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Missing username or password.
        '401':
          description: Invalid credentials.
        '429':
          description: Too many login attempts. Try again later.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Deletes the caller's token and writes a LOGOUT audit entry.
