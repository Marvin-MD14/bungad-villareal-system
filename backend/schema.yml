components:
  schemas:
    ActionEnum:
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - LOGIN
      - LOGOUT
      - VOID
      - RESTOCK
      type: string
      description: |-
        * `CREATE` - Create
        * `UPDATE` - Update
        * `DELETE` - Delete
        * `LOGIN` - Login
        * `LOGOUT` - Logout
        * `VOID` - Void
        * `RESTOCK` - Restock
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        branch:
          type: integer
        date:
          type: string
          format: date
        time_in:
          type: string
          format: date-time
          nullable: true
        time_out:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        user_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        hours_worked:
          type: number
          format: double
          readOnly: true
      required:
      - branch
      - branch_name
      - created_at
      - date
      - full_name
      - hours_worked
      - id
      - user
      - user_name
    AttendanceRequest:
      type: object
      properties:
        user:
          type: integer
        branch:
          type: integer
        date:
          type: string
          format: date
        time_in:
          type: string
          format: date-time
          nullable: true
        time_out:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        notes:
          type: string
          nullable: true
      required:
      - branch
      - date
      - user
    AttendanceStatusEnum:
      enum:
      - PRESENT
      - LATE
      - ABSENT
      - HALF_DAY
      type: string
      description: |-
        * `PRESENT` - Present
        * `LATE` - Late
        * `ABSENT` - Absent
        * `HALF_DAY` - Half Day
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        business:
          type: integer
          nullable: true
        branch:
          type: integer
          nullable: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        model_name:
          type: string
          maxLength: 100
        object_id:
          type: string
          nullable: true
          maxLength: 50
        description:
          type: string
        ip_address:
          type: string
          nullable: true
        request_id:
          type: string
          nullable: true
          maxLength: 64
        user_agent:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        user_name:
          type: string
          readOnly: true
        branch_name:
          type: string
          readOnly: true
      required:
      - action
      - branch_name
      - created_at
      - description
      - id
      - model_name
      - user_name
    AuthUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        role_code:
          type: string
        branch:
          type: object
          additionalProperties: {}
          nullable: true
        services:
          type: array
          items:
            type: string
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
      required:
      - branch
      - id
      - is_staff
      - is_superuser
      - role
      - role_code
      - services
      - username
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business:
          type: integer
          nullable: true
        business_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 20
        branch_type:
          type: string
          readOnly: true
        branch_type_display:
          type: string
          readOnly: true
        address:
          type: string
          nullable: true
        contact_number:
          type: string
          nullable: true
          maxLength: 20
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        opens_at:
          type: string
          format: time
          nullable: true
        closes_at:
          type: string
          format: time
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        total_staff:
          type: string
          readOnly: true
        total_rooms:
          type: string
          readOnly: true
      required:
      - branch_type
      - branch_type_display
      - business_name
      - created_at
      - id
      - name
      - total_rooms
      - total_staff
      - updated_at
    BranchRequest:
      type: object
      properties:
        business:
          type: integer
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          maxLength: 20
        address:
          type: string
          nullable: true
        contact_number:
          type: string
          nullable: true
          maxLength: 20
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        opens_at:
          type: string
          format: time
          nullable: true
        closes_at:
          type: string
          format: time
          nullable: true
        is_active:
          type: boolean
      required:
      - name
    Business:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        business_type:
          type: integer
          description: Spa / Restaurant / Auto shop ... determines default item kinds
        business_type_detail:
          allOf:
          - $ref: '#/components/schemas/BusinessType'
          readOnly: true
        description:
          type: string
        logo:
          type: string
          format: uri
          nullable: true
        receipt_header:
          type: string
        currency:
          type: string
          maxLength: 3
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        loyalty_enabled:
          type: boolean
        is_active:
          type: boolean
        branch_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - branch_count
      - business_type
      - business_type_detail
      - created_at
      - id
      - name
      - slug
      - updated_at
    BusinessChoice:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          nullable: true
        type_name:
          type: string
          nullable: true
      required:
      - id
      - name
      - slug
      - type
      - type_name
    BusinessItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        business:
          type: integer
        item:
          allOf:
          - $ref: '#/components/schemas/Item'
          readOnly: true
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        effective_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        is_available:
          type: boolean
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - business
      - effective_price
      - id
      - item
    BusinessItemRequest:
      type: object
      properties:
        business:
          type: integer
        item_id:
          type: integer
          writeOnly: true
        price_override:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        is_available:
          type: boolean
        sort_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - business
      - item_id
    BusinessRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        business_type:
          type: integer
          description: Spa / Restaurant / Auto shop ... determines default item kinds
        description:
          type: string
        logo:
          type: string
          format: binary
          nullable: true
        receipt_header:
          type: string
        currency:
          type: string
          maxLength: 3
        tax_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        loyalty_enabled:
          type: boolean
        is_active:
          type: boolean
      required:
      - business_type
      - name
      - slug
    BusinessType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
