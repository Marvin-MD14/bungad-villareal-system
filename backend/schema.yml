openapi: 3.0.3
info:
  title: Bungad & Villareal Management System API
  version: 1.0.0
  description: Comprehensive REST API documentation for POS, Multi-Branch Inventory,
    Loyalty & Rewards, and Staff Management.
paths:
  /api/attendance/:
    get:
      operationId: attendance_list
      description: |-
        Give a viewset automatic business/branch scoping.

        Set ``branch_lookup`` to the ORM path that maps a row to a branch when it
        is not a plain ``branch_id`` (e.g. ``inventory_levels__branch_id`` for
        the unified catalog, or ``pk`` for Branch itself).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - attendance
      security:
      - TokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
